<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del repuesto - AutoGest</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon_1.png}" href="/img/logo-icon_1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        turquoise: { DEFAULT: '#14B8B3', hover: '#0E9490', dark: '#2DD4CF', darkhover: '#22B8B3' },
                        navy: { DEFAULT: '#0B2545', surface: '#1B2333' },
                        graphite: '#14181D'
                    },
                    fontFamily: { display: ['Manrope', 'sans-serif'], sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-700 dark:bg-graphite dark:text-slate-200 font-sans">

<div id="overlay" class="fixed inset-0 z-40 hidden bg-navy/40 lg:hidden"></div>

<div th:replace="~{fragments/sidebar :: sidebar('catalogo')}"></div>

<main class="min-h-screen lg:ml-72">
    <header class="flex h-20 items-center justify-between border-b border-slate-200 bg-white px-5 dark:border-white/5 dark:bg-graphite sm:px-8">
        <div class="flex items-center gap-3">
            <button id="menu-button" class="rounded-lg p-2 text-navy hover:bg-slate-100 dark:text-white dark:hover:bg-white/10 lg:hidden" aria-label="Abrir menú"><i class="bi bi-list text-xl" aria-hidden="true"></i></button>
            <div>
                <p class="text-sm text-slate-500 dark:text-slate-400">
                    <a th:href="@{/repuesto/catalogo}" href="#" class="hover:text-turquoise dark:hover:text-turquoise-dark">Catálogo</a> / Detalle
                </p>
                <h1 class="font-display text-xl font-bold text-navy dark:text-white" th:text="${repuesto.nombre}">Radiador</h1>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="theme-toggle" aria-label="Cambiar tema" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-navy hover:border-turquoise dark:border-white/10 dark:text-white transition-colors">
                <i id="icon-moon" class="bi bi-moon text-sm" aria-hidden="true"></i>
                <i id="icon-sun" class="bi bi-sun text-sm hidden" aria-hidden="true"></i>
            </button>
            <button onclick="history.back()" class="flex items-center gap-2 rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-navy transition-colors hover:border-turquoise hover:text-turquoise dark:border-white/10 dark:text-white dark:hover:border-turquoise-dark dark:hover:text-turquoise-dark">
                <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
            </button>
            <a th:if="${session.rolUsuario == 'ADMINISTRADOR'}" th:href="@{/repuesto/editar/{id}(id=${repuesto.id})}" href="#" class="flex items-center gap-2 rounded-lg bg-turquoise px-4 py-2 text-sm font-semibold text-white dark:text-navy transition-colors hover:bg-turquoise-hover">
                <i class="bi bi-pencil" aria-hidden="true"></i> Editar
            </a>
        </div>
    </header>

    <section class="mx-auto max-w-3xl px-5 py-8 sm:px-8">

        <div th:if="${exito}" class="mb-5 rounded-lg border border-turquoise/20 bg-turquoise/10 px-4 py-3 text-sm text-turquoise-hover dark:text-turquoise-dark" th:text="${exito}">Éxito</div>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-3">

            <!-- ============ FICHA PRINCIPAL ============ -->
            <div class="sm:col-span-2 rounded-xl border border-slate-200 bg-white dark:border-white/5 dark:bg-navy-surface">
                <div class="flex items-center justify-between border-b border-slate-100 px-6 py-5 dark:border-white/5">
                    <h2 class="font-display font-bold text-navy dark:text-white">Datos del repuesto</h2>
                    <span th:if="${repuesto.stock == 0}" class="rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-600 dark:bg-red-500/15 dark:text-red-400">Agotado</span>
                    <span th:if="${repuesto.stock gt 0 and repuesto.stock le stockBajoLimite}" class="rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-700 dark:bg-amber-500/15 dark:text-amber-400"><i class="bi bi-exclamation-triangle"></i> Stock bajo</span>
                    <span th:if="${repuesto.stock gt stockBajoLimite}" class="rounded-full bg-turquoise/10 px-3 py-1 text-xs font-semibold text-turquoise-hover dark:text-turquoise-dark"><i class="bi bi-check2-circle"></i> Disponible</span>
                </div>

                <dl class="grid grid-cols-2 gap-x-4 gap-y-5 px-6 py-6">
                    <div>
                        <dt class="text-xs font-medium uppercase tracking-wide text-slate-400">Categoría</dt>
                        <dd class="mt-1 text-base text-navy dark:text-white" th:text="${repuesto.categoria}">Enfriamiento</dd>
                    </div>
                    <div>
                        <dt class="text-xs font-medium uppercase tracking-wide text-slate-400">Precio</dt>
                        <dd class="mt-1 font-mono text-base font-semibold text-navy dark:text-white" th:text="'L. ' + ${#numbers.formatDecimal(repuesto.precio, 1, 'COMMA', 2, 'POINT')}">L. 2,500.00</dd>
                    </div>
                    <div>
                        <dt class="text-xs font-medium uppercase tracking-wide text-slate-400">Stock disponible</dt>
                        <dd class="mt-1 text-base text-navy dark:text-white" th:text="${repuesto.stock}">5</dd>
                    </div>
                    <div>
                        <dt class="text-xs font-medium uppercase tracking-wide text-slate-400">Proveedor</dt>
                        <dd class="mt-1 text-base text-navy dark:text-white" th:text="${nombreProveedor} ?: 'Sin proveedor asignado'">Repuestos El Motor</dd>
                    </div>
                </dl>
            </div>

            <!-- ============ ACCIONES ============ -->
            <div class="rounded-xl border border-slate-200 bg-white p-6 dark:border-white/5 dark:bg-navy-surface">
                <h3 class="font-display font-bold text-navy dark:text-white">Acciones</h3>
                <div class="mt-4 flex flex-col gap-3">
                    <a th:if="${session.rolUsuario == 'ADMINISTRADOR'}" th:href="@{/repuesto/editar/{id}(id=${repuesto.id})}" href="#" class="flex items-center justify-between rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-medium text-navy hover:border-turquoise hover:text-turquoise dark:border-white/10 dark:text-white transition-colors">
                        <span>Editar repuesto</span><i class="bi bi-pencil" aria-hidden="true"></i>
                    </a>
                    <a th:href="@{/repuesto/catalogo}" href="#" class="flex items-center justify-between rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-medium text-navy hover:border-turquoise hover:text-turquoise dark:border-white/10 dark:text-white transition-colors">
                        <span>Volver al catálogo</span><i class="bi bi-arrow-left" aria-hidden="true"></i>
                    </a>
                    <form th:if="${session.rolUsuario == 'ADMINISTRADOR'}" th:action="@{/repuesto/eliminar/{id}(id=${repuesto.id})}" method="post"
                          onsubmit="return confirm('¿Seguro que querés eliminar este repuesto? Esta acción no se puede deshacer.');">
                        <button type="submit" class="flex w-full items-center justify-between rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-medium text-red-500 hover:border-red-300 hover:bg-red-50 dark:border-white/10 dark:hover:bg-red-500/10 transition-colors">
                            <span>Eliminar repuesto</span><i class="bi bi-trash" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    const root = document.documentElement;
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menu-button');
    function toggleMenu() { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
    menuButton?.addEventListener('click', toggleMenu);
    overlay?.addEventListener('click', toggleMenu);

    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    function applyTheme(isDark) {
        root.classList.toggle('dark', isDark);
        iconMoon.classList.toggle('hidden', isDark);
        iconSun.classList.toggle('hidden', !isDark);
    }
    const savedTheme = localStorage.getItem('autogest-theme');
    applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = !root.classList.contains('dark');
        applyTheme(isDark);
        localStorage.setItem('autogest-theme', isDark ? 'dark' : 'light');
    });
</script>
</body>
</html>
