<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar repuesto - AutoGest</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon_1.png}" href="/img/logo-icon_1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        turquoise: { DEFAULT: '#14B8B3', hover: '#0E9490', dark: '#2DD4CF', darkhover: '#22B8B3' },
                        navy: { DEFAULT: '#0B2545', surface: '#1B2333' },
                        graphite: '#14181D'
                    },
                    fontFamily: { display: ['Manrope', 'sans-serif'], sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-700 dark:bg-graphite dark:text-slate-200 font-sans">

<div id="overlay" class="fixed inset-0 z-40 hidden bg-navy/40 lg:hidden"></div>

<div th:replace="~{fragments/sidebar :: sidebar('repuesto')}"></div>

<main class="min-h-screen lg:ml-72">
    <header class="flex h-20 items-center justify-between border-b border-slate-200 bg-white px-5 dark:border-white/5 dark:bg-graphite sm:px-8">
        <div class="flex items-center gap-3">
            <button id="menu-button" class="rounded-lg p-2 text-navy hover:bg-slate-100 dark:text-white dark:hover:bg-white/10 lg:hidden" aria-label="Abrir menú"><i class="bi bi-list text-xl" aria-hidden="true"></i></button>
            <div>
                <p class="text-sm text-slate-500 dark:text-slate-400">
                    <a th:href="@{/repuesto}" href="#" class="hover:text-turquoise dark:hover:text-turquoise-dark">Inventario</a> / Editar
                </p>
                <h1 class="font-display text-xl font-bold text-navy dark:text-white">Editar repuesto</h1>
            </div>
        </div>
        <button id="theme-toggle" aria-label="Cambiar tema" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-navy hover:border-turquoise dark:border-white/10 dark:text-white transition-colors">
            <i id="icon-moon" class="bi bi-moon text-sm" aria-hidden="true"></i>
            <i id="icon-sun" class="bi bi-sun text-sm hidden" aria-hidden="true"></i>
        </button>
        <button onclick="history.back()" class="flex items-center gap-2 rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-navy transition-colors hover:border-turquoise hover:text-turquoise dark:border-white/10 dark:text-white dark:hover:border-turquoise-dark dark:hover:text-turquoise-dark">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
        </button>
    </header>

    <section class="mx-auto max-w-xl px-5 py-8 sm:px-8">

        <div th:if="${error}" class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600 dark:border-red-500/20 dark:bg-red-500/10 dark:text-red-400" th:text="${error}">Error</div>

        <div class="rounded-xl border border-slate-200 bg-white p-6 dark:border-white/5 dark:bg-navy-surface sm:p-8">

            <form th:action="@{/repuesto/editar/{id}(id=${repuesto.id})}" method="post" class="grid grid-cols-1 gap-5" id="form-repuesto">

                <div>
                    <label for="nombre" class="mb-1.5 block text-sm font-medium text-navy dark:text-white">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required th:value="${repuesto.nombre}"
                           class="h-11 w-full rounded-lg border border-slate-200 bg-white px-3.5 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
                </div>

                <div>
                    <label for="categoria" class="mb-1.5 block text-sm font-medium text-navy dark:text-white">Categoría</label>
                    <input type="text" id="categoria" name="categoria" required list="lista-categorias" th:value="${repuesto.categoria}"
                           class="h-11 w-full rounded-lg border border-slate-200 bg-white px-3.5 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
                    <datalist id="lista-categorias">
                        <option th:each="c : ${categorias}" th:value="${c}"></option>
                    </datalist>
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label for="precio" class="mb-1.5 block text-sm font-medium text-navy dark:text-white">Precio</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 font-mono text-sm text-slate-400">L.</span>
                            <input type="number" id="precio" name="precio" required min="0" step="1" inputmode="numeric"
                                   th:value="${#numbers.formatInteger(repuesto.precio, 1)}"
                                   class="h-11 w-full rounded-lg border border-slate-200 bg-white pl-9 pr-3 font-mono text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
                        </div>
                    </div>
                    <div>
                        <label class="mb-1.5 block text-sm font-medium text-navy dark:text-white">Stock actual</label>
                        <div class="flex h-11 items-center rounded-lg border border-slate-200 bg-slate-50 px-3.5 font-mono text-sm text-slate-500 dark:border-white/10 dark:bg-white/5 dark:text-slate-400">
                            <span th:text="${repuesto.stock}">0</span>
                            <span class="ml-2 text-xs">(se actualiza por pedidos de lote)</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="idProveedor" class="mb-1.5 block text-sm font-medium text-navy dark:text-white">Proveedor</label>
                    <div class="relative">
                        <select id="idProveedor" name="idProveedor"
                                class="h-11 w-full appearance-none rounded-lg border border-slate-200 bg-white px-3.5 pr-9 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
                            <option value="" th:selected="${repuesto.idProveedor == 0}">Sin proveedor asignado</option>
                            <option th:each="p : ${proveedores}" th:value="${p[0]}" th:text="${p[1]}"
                                    th:selected="${p[0] == repuesto.idProveedor}">Proveedor</option>
                        </select>
                        <i class="bi bi-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="mt-2 flex items-center gap-3">
                    <button type="submit"
                            class="h-11 rounded-lg bg-turquoise px-6 text-sm font-semibold text-white transition-colors hover:bg-turquoise-hover dark:text-navy dark:hover:bg-turquoise-darkhover">
                        Guardar cambios
                    </button>
                    <a th:href="@{/repuesto/{id}(id=${repuesto.id})}" href="#" class="text-sm font-medium text-slate-500 hover:text-navy dark:text-slate-400 dark:hover:text-white">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>

<script>
    const root = document.documentElement;
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menu-button');
    function toggleMenu() { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
    menuButton?.addEventListener('click', toggleMenu);
    overlay?.addEventListener('click', toggleMenu);

    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    function applyTheme(isDark) {
        root.classList.toggle('dark', isDark);
        iconMoon.classList.toggle('hidden', isDark);
        iconSun.classList.toggle('hidden', !isDark);
    }
    const savedTheme = localStorage.getItem('autogest-theme');
    applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = !root.classList.contains('dark');
        applyTheme(isDark);
        localStorage.setItem('autogest-theme', isDark ? 'dark' : 'light');
    });

    document.getElementById('precio').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
</script>
</body>
</html>
