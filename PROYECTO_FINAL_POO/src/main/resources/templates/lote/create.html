<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo pedido de lote - AutoGest</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon_1.png}" href="/img/logo-icon_1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        turquoise: { DEFAULT: '#14B8B3', hover: '#0E9490', dark: '#2DD4CF', darkhover: '#22B8B3' },
                        navy: { DEFAULT: '#0B2545', surface: '#1B2333' },
                        graphite: '#14181D'
                    },
                    fontFamily: { display: ['Manrope', 'sans-serif'], sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-700 dark:bg-graphite dark:text-slate-200 font-sans">

<div id="overlay" class="fixed inset-0 z-40 hidden bg-navy/40 lg:hidden"></div>

<div th:replace="~{fragments/sidebar :: sidebar('lote')}"></div>

<main class="min-h-screen lg:ml-72">
    <header class="flex h-20 items-center justify-between border-b border-slate-200 bg-white px-5 dark:border-white/5 dark:bg-graphite sm:px-8">
        <div class="flex items-center gap-3">
            <button id="menu-button" class="rounded-lg p-2 text-navy hover:bg-slate-100 dark:text-white dark:hover:bg-white/10 lg:hidden" aria-label="Abrir menú"><i class="bi bi-list text-xl" aria-hidden="true"></i></button>
            <div>
                <p class="text-sm text-slate-500 dark:text-slate-400">
                    <a th:href="@{/lote}" href="#" class="hover:text-turquoise dark:hover:text-turquoise-dark">Pedidos de lote</a> / Nuevo
                </p>
                <h1 class="font-display text-xl font-bold text-navy dark:text-white">Nuevo pedido de lote</h1>
            </div>
        </div>
        <button id="theme-toggle" aria-label="Cambiar tema" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-navy hover:border-turquoise dark:border-white/10 dark:text-white transition-colors">
            <i id="icon-moon" class="bi bi-moon text-sm" aria-hidden="true"></i>
            <i id="icon-sun" class="bi bi-sun text-sm hidden" aria-hidden="true"></i>
        </button>
        <button onclick="history.back()" class="flex items-center gap-2 rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-navy transition-colors hover:border-turquoise hover:text-turquoise dark:border-white/10 dark:text-white dark:hover:border-turquoise-dark dark:hover:text-turquoise-dark">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
        </button>
    </header>

    <section class="mx-auto max-w-2xl px-5 py-8 sm:px-8">

        <div th:if="${error}" class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600 dark:border-red-500/20 dark:bg-red-500/10 dark:text-red-400" th:text="${error}">Error</div>

        <div th:if="${proveedores == null or proveedores.empty}" class="mb-6 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700 dark:border-amber-500/20 dark:bg-amber-500/10 dark:text-amber-400">
            No hay proveedores registrados todavía. <a th:href="@{/proveedor/nuevo}" href="#" class="font-semibold hover:underline">Registrá uno primero →</a>
        </div>
        <div th:if="${repuestos == null or repuestos.empty}" class="mb-6 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700 dark:border-amber-500/20 dark:bg-amber-500/10 dark:text-amber-400">
            No hay repuestos registrados todavía. <a th:href="@{/repuesto/nuevo}" href="#" class="font-semibold hover:underline">Registrá uno primero →</a>
        </div>

        <form th:action="@{/lote/nuevo}" method="post" class="flex flex-col gap-6" id="form-lote">

            <div class="rounded-xl border border-slate-200 bg-white p-6 dark:border-white/5 dark:bg-navy-surface">
                <label for="idProveedor" class="mb-1.5 block text-sm font-medium text-navy dark:text-white">Proveedor</label>
                <div class="relative">
                    <select id="idProveedor" name="idProveedor" required
                            class="h-11 w-full appearance-none rounded-lg border border-slate-200 bg-white px-3.5 pr-9 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
                        <option value="" disabled selected>Seleccioná un proveedor</option>
                        <option th:each="p : ${proveedores}" th:value="${p[0]}" th:text="${p[1]}">Proveedor</option>
                    </select>
                    <i class="bi bi-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400" aria-hidden="true"></i>
                </div>
            </div>

            <div class="rounded-xl border border-slate-200 bg-white p-6 dark:border-white/5 dark:bg-navy-surface">
                <div class="flex items-center justify-between">
                    <h2 class="font-display font-bold text-navy dark:text-white">Repuestos del pedido</h2>
                    <button type="button" id="btn-agregar-linea" class="flex items-center gap-1 text-sm font-semibold text-turquoise dark:text-turquoise-dark hover:underline">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar repuesto
                    </button>
                </div>
                <div id="lineas-repuesto" class="mt-4 flex flex-col gap-3"></div>
                <p id="mensaje-sin-lineas" class="mt-3 text-sm text-slate-500 dark:text-slate-400">Agregá al menos un repuesto al pedido.</p>
            </div>

            <div class="flex items-center gap-3">
                <button type="submit" class="h-11 rounded-lg bg-turquoise px-6 text-sm font-semibold text-white transition-colors hover:bg-turquoise-hover dark:text-navy dark:hover:bg-turquoise-darkhover">
                    Registrar pedido
                </button>
                <a th:href="@{/lote}" href="#" class="text-sm font-medium text-slate-500 hover:text-navy dark:text-slate-400 dark:hover:text-white">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<script th:inline="javascript">
    /*<![CDATA[*/
    const repuestosData = /*[[${repuestos}]]*/ [];
    /*]]>*/
</script>

<script>
    const root = document.documentElement;
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menu-button');
    function toggleMenu() { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
    menuButton?.addEventListener('click', toggleMenu);
    overlay?.addEventListener('click', toggleMenu);

    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    function applyTheme(isDark) {
        root.classList.toggle('dark', isDark);
        iconMoon.classList.toggle('hidden', isDark);
        iconSun.classList.toggle('hidden', !isDark);
    }
    const savedTheme = localStorage.getItem('autogest-theme');
    applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = !root.classList.contains('dark');
        applyTheme(isDark);
        localStorage.setItem('autogest-theme', isDark ? 'dark' : 'light');
    });

    // ============ Líneas dinámicas de repuestos ============
    const contenedorLineas = document.getElementById('lineas-repuesto');
    const btnAgregarLinea = document.getElementById('btn-agregar-linea');
    const mensajeSinLineas = document.getElementById('mensaje-sin-lineas');
    let contador = 0;

    function actualizarMensaje() {
        mensajeSinLineas.classList.toggle('hidden', contenedorLineas.children.length > 0);
    }

    function crearLinea() {
        contador++;
        const fila = document.createElement('div');
        fila.className = 'flex items-center gap-3';

        const opciones = repuestosData.map(r =>
            `<option value="${r.id}">${r.nombre} (${r.categoria})</option>`
        ).join('');

        fila.innerHTML = `
            <select name="idRepuesto" required class="h-11 flex-1 rounded-lg border border-slate-200 bg-white px-3.5 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
                <option value="" disabled selected>Seleccioná un repuesto</option>
                ${opciones}
            </select>
            <input type="number" name="cantidad" min="1" value="1" required
                   class="h-11 w-24 rounded-lg border border-slate-200 bg-white px-3 font-mono text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
            <button type="button" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-400 hover:bg-red-50 hover:text-red-500 dark:hover:bg-red-500/10 dark:hover:text-red-400 btn-quitar-linea">
                <i class="bi bi-trash" aria-hidden="true"></i>
            </button>
        `;

        contenedorLineas.appendChild(fila);
        fila.querySelector('.btn-quitar-linea').addEventListener('click', () => {
            fila.remove();
            actualizarMensaje();
        });
        actualizarMensaje();
    }

    btnAgregarLinea.addEventListener('click', crearLinea);
    crearLinea(); // arranca con una línea lista para completar
    actualizarMensaje();

    document.getElementById('form-lote').addEventListener('submit', (e) => {
        if (contenedorLineas.children.length === 0) {
            e.preventDefault();
            alert('Agregá al menos un repuesto al pedido.');
        }
    });
</script>
</body>
</html>
