<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas - AutoGest</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon_1.png}" href="/img/logo-icon_1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        turquoise: { DEFAULT: '#14B8B3', hover: '#0E9490', dark: '#2DD4CF', darkhover: '#22B8B3' },
                        navy: { DEFAULT: '#0B2545', surface: '#1B2333' },
                        graphite: '#14181D'
                    },
                    fontFamily: { display: ['Manrope', 'sans-serif'], sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-700 dark:bg-graphite dark:text-slate-200 font-sans">

<div id="overlay" class="fixed inset-0 z-40 hidden bg-navy/40 lg:hidden"></div>

<div th:replace="~{fragments/sidebar :: sidebar('factura')}"></div>

<main class="min-h-screen lg:ml-72">
    <header class="flex h-20 items-center justify-between border-b border-slate-200 bg-white px-5 dark:border-white/5 dark:bg-graphite sm:px-8">
        <div class="flex items-center gap-3">
            <button id="menu-button" class="rounded-lg p-2 text-navy hover:bg-slate-100 dark:text-white dark:hover:bg-white/10 lg:hidden" aria-label="Abrir menú"><i class="bi bi-list text-xl" aria-hidden="true"></i></button>
            <h1 class="font-display text-xl font-bold text-navy dark:text-white">Facturas</h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="theme-toggle" aria-label="Cambiar tema" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-navy hover:border-turquoise dark:border-white/10 dark:text-white transition-colors">
                <i id="icon-moon" class="bi bi-moon text-sm" aria-hidden="true"></i>
                <i id="icon-sun" class="bi bi-sun text-sm hidden" aria-hidden="true"></i>
            </button>
            <a th:href="@{/factura/nueva}" href="#" class="flex items-center gap-2 rounded-lg bg-turquoise px-4 py-2 text-sm font-semibold text-white dark:text-navy transition-colors hover:bg-turquoise-hover">
                <i class="bi bi-plus-lg" aria-hidden="true"></i> Generar factura
            </a>
        </div>
    </header>

    <section class="mx-auto max-w-5xl px-5 py-8 sm:px-8">

        <div th:if="${exito}" class="mb-5 rounded-lg border border-turquoise/20 bg-turquoise/10 px-4 py-3 text-sm text-turquoise-hover dark:text-turquoise-dark" th:text="${exito}">Éxito</div>

        <!-- ============ FILTROS ============ -->
        <form th:action="@{/factura}" method="get" class="mb-6 grid grid-cols-1 gap-3 rounded-xl border border-slate-200 bg-white p-4 dark:border-white/5 dark:bg-navy-surface sm:grid-cols-4">
            <div class="sm:col-span-2">
                <label for="busqueda" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Cliente o placa</label>
                <div class="relative">
                    <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm" aria-hidden="true"></i>
                    <input type="text" id="busqueda" name="busqueda" th:value="${param.busqueda}" placeholder="Buscar por cliente o placa..."
                           class="h-10 w-full rounded-lg border border-slate-200 bg-white pl-9 pr-3 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
                </div>
            </div>
            <div>
                <label for="desde" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Desde</label>
                <input type="date" id="desde" name="desde" th:value="${param.desde}"
                       class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
            </div>
            <div>
                <label for="hasta" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Hasta</label>
                <input type="date" id="hasta" name="hasta" th:value="${param.hasta}"
                       class="h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm text-navy focus:border-transparent focus:outline-none focus:ring-2 focus:ring-turquoise dark:border-white/10 dark:bg-graphite dark:text-white">
            </div>
            <div class="sm:col-span-4 flex items-center gap-3">
                <button type="submit" class="flex items-center gap-2 rounded-lg bg-navy dark:bg-turquoise px-4 py-2 text-sm font-semibold text-white dark:text-navy transition-colors hover:opacity-90">
                    <i class="bi bi-funnel" aria-hidden="true"></i> Filtrar
                </button>
                <a th:href="@{/factura}" href="#" class="text-sm font-medium text-slate-500 hover:text-turquoise dark:text-slate-400 dark:hover:text-turquoise-dark">Limpiar filtros</a>
            </div>
        </form>

        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white dark:border-white/5 dark:bg-navy-surface">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="border-b border-slate-100 dark:border-white/5">
                    <tr class="text-xs font-semibold uppercase tracking-wide text-slate-400">
                        <th class="px-6 py-3">Cliente</th>
                        <th class="px-6 py-3">Vehículo</th>
                        <th class="px-6 py-3">Reparación</th>
                        <th class="px-6 py-3">Fecha</th>
                        <th class="px-6 py-3 text-right">Total</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-white/5">
                    <tr th:each="f : ${facturas}" th:attr="data-href=@{/factura/{id}(id=${f.id})}" class="cursor-pointer hover:bg-slate-50 dark:hover:bg-white/5">
                        <td class="px-6 py-3.5 font-medium text-navy dark:text-white" th:text="${f.cliente_nombre}">Juan Pérez</td>
                        <td class="px-6 py-3.5 font-mono text-slate-600 dark:text-slate-300" th:text="${f.placa}">ABC-1234</td>
                        <td class="px-6 py-3.5 text-slate-600 dark:text-slate-300" th:text="${f.tipo_reparacion}">Cambio de batería</td>
                        <td class="px-6 py-3.5 text-slate-500 dark:text-slate-400" th:text="${f.fecha}">2026-07-20</td>
                        <td class="px-6 py-3.5 text-right font-mono font-semibold text-navy dark:text-white" th:text="'L. ' + ${#numbers.formatDecimal(f.monto_total, 1, 'COMMA', 2, 'POINT')}">L. 2,100.00</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${facturas == null or facturas.empty}" class="px-6 py-16 text-center">
                <i class="bi bi-receipt text-3xl text-slate-300 dark:text-slate-600" aria-hidden="true"></i>
                <p class="mt-3 font-medium text-navy dark:text-white">Todavía no se ha generado ninguna factura.</p>
                <a th:href="@{/factura/nueva}" href="#" class="mt-4 inline-block text-sm font-semibold text-turquoise dark:text-turquoise-dark hover:underline">Generar la primera →</a>
            </div>

            <!-- ============ PAGINACIÓN ============ -->
            <div th:if="${facturas != null and !facturas.empty and totalPaginas > 1}"
                 class="flex items-center justify-center gap-1.5 border-t border-slate-100 px-6 py-4 dark:border-white/5">

                <a th:if="${paginaActual > 1}"
                   th:href="@{/factura(pagina=${paginaActual - 1}, busqueda=${param.busqueda}, desde=${param.desde}, hasta=${param.hasta})}"
                   href="#"
                   class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-white/10 transition-colors">
                    <i class="bi bi-chevron-left text-sm" aria-hidden="true"></i>
                </a>

                <a th:each="p : ${#numbers.sequence(1, totalPaginas)}"
                   th:href="@{/factura(pagina=${p}, busqueda=${param.busqueda}, desde=${param.desde}, hasta=${param.hasta})}"
                   href="#"
                   th:text="${p}"
                   th:classappend="${p == paginaActual} ? 'bg-turquoise text-white dark:text-navy font-semibold' : 'text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/10'"
                   class="flex h-8 min-w-8 items-center justify-center rounded-lg px-2 text-sm transition-colors">1</a>

                <a th:if="${paginaActual < totalPaginas}"
                   th:href="@{/factura(pagina=${paginaActual + 1}, busqueda=${param.busqueda}, desde=${param.desde}, hasta=${param.hasta})}"
                   href="#"
                   class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-white/10 transition-colors">
                    <i class="bi bi-chevron-right text-sm" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </section>

    <div th:replace="~{fragments/footer :: footer}"></div>
</main>

<script>
    const root = document.documentElement;
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menu-button');
    function toggleMenu() { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
    menuButton?.addEventListener('click', toggleMenu);
    overlay?.addEventListener('click', toggleMenu);

    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    function applyTheme(isDark) {
        root.classList.toggle('dark', isDark);
        iconMoon.classList.toggle('hidden', isDark);
        iconSun.classList.toggle('hidden', !isDark);
    }
    const savedTheme = localStorage.getItem('autogest-theme');
    applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = !root.classList.contains('dark');
        applyTheme(isDark);
        localStorage.setItem('autogest-theme', isDark ? 'dark' : 'light');
    });

    document.querySelectorAll('tr[data-href]').forEach(fila => {
        fila.addEventListener('click', () => window.location.href = fila.dataset.href);
    });
</script>
</body>
</html>
