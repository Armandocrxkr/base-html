<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del proveedor - AutoGest</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-icon_1.png}" href="/img/logo-icon_1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        turquoise: { DEFAULT: '#14B8B3', hover: '#0E9490', dark: '#2DD4CF', darkhover: '#22B8B3' },
                        navy: { DEFAULT: '#0B2545', surface: '#1B2333' },
                        graphite: '#14181D'
                    },
                    fontFamily: { display: ['Manrope', 'sans-serif'], sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-700 dark:bg-graphite dark:text-slate-200 font-sans">

<div id="overlay" class="fixed inset-0 z-40 hidden bg-navy/40 lg:hidden"></div>

<div th:replace="~{fragments/sidebar :: sidebar('proveedor')}"></div>

<main class="min-h-screen lg:ml-72">
    <header class="flex h-20 items-center justify-between border-b border-slate-200 bg-white px-5 dark:border-white/5 dark:bg-graphite sm:px-8">
        <div class="flex items-center gap-3">
            <button id="menu-button" class="rounded-lg p-2 text-navy hover:bg-slate-100 dark:text-white dark:hover:bg-white/10 lg:hidden" aria-label="Abrir menú"><i class="bi bi-list text-xl" aria-hidden="true"></i></button>
            <div>
                <p class="text-sm text-slate-500 dark:text-slate-400">
                    <a th:href="@{/proveedor}" href="#" class="hover:text-turquoise dark:hover:text-turquoise-dark">Proveedores</a> / Detalle
                </p>
                <h1 class="font-display text-xl font-bold text-navy dark:text-white" th:text="${proveedor.nombre}">Repuestos El Motor</h1>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="theme-toggle" aria-label="Cambiar tema" class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-navy hover:border-turquoise dark:border-white/10 dark:text-white transition-colors">
                <i id="icon-moon" class="bi bi-moon text-sm" aria-hidden="true"></i>
                <i id="icon-sun" class="bi bi-sun text-sm hidden" aria-hidden="true"></i>
            </button>
            <button onclick="history.back()" class="flex items-center gap-2 rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-navy transition-colors hover:border-turquoise hover:text-turquoise dark:border-white/10 dark:text-white dark:hover:border-turquoise-dark dark:hover:text-turquoise-dark">
                <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver
            </button>
            <a th:href="@{/proveedor/editar/{id}(id=${proveedor.id})}" href="#" class="flex items-center gap-2 rounded-lg bg-turquoise px-4 py-2 text-sm font-semibold text-white dark:text-navy transition-colors hover:bg-turquoise-hover">
                <i class="bi bi-pencil" aria-hidden="true"></i> Editar
            </a>
        </div>
    </header>

    <section class="mx-auto max-w-4xl px-5 py-8 sm:px-8">

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">

            <!-- ============ FICHA DEL PROVEEDOR ============ -->
            <div class="rounded-xl border border-slate-200 bg-white p-6 dark:border-white/5 dark:bg-navy-surface">
                <div class="flex items-center gap-3">
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-turquoise/15 text-lg font-bold text-turquoise-hover dark:text-turquoise-dark"
                         th:text="${#strings.toUpperCase(#strings.substring(proveedor.nombre,0,1))}">R</div>
                    <div>
                        <p class="font-display font-bold text-navy dark:text-white" th:text="${proveedor.nombre}">Repuestos El Motor</p>
                        <p class="text-xs text-slate-400">Proveedor</p>
                    </div>
                </div>
                <dl class="mt-6 space-y-4">
                    <div>
                        <dt class="text-xs font-medium uppercase tracking-wide text-slate-400">Contacto</dt>
                        <dd class="mt-1 text-sm text-navy dark:text-white" th:text="${proveedor.contacto} ?: 'No especificado'">Luis Fernández</dd>
                    </div>
                    <div>
                        <dt class="text-xs font-medium uppercase tracking-wide text-slate-400">Teléfono</dt>
                        <dd class="mt-1 font-mono text-sm text-navy dark:text-white" th:text="${proveedor.telefono}">2233-4455</dd>
                    </div>
                </dl>

                <div class="mt-6 flex flex-col gap-3 border-t border-slate-100 pt-5 dark:border-white/5">
                    <a th:href="@{/lote/nuevo}" href="#" class="flex items-center justify-between rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-medium text-navy hover:border-turquoise hover:text-turquoise dark:border-white/10 dark:text-white transition-colors">
                        <span>Nuevo pedido de lote</span><i class="bi bi-box-seam" aria-hidden="true"></i>
                    </a>
                    <form th:action="@{/proveedor/eliminar/{id}(id=${proveedor.id})}" method="post"
                          onsubmit="return confirm('¿Seguro que querés eliminar este proveedor? Esta acción no se puede deshacer.');">
                        <button type="submit" class="flex w-full items-center justify-between rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-medium text-red-500 hover:border-red-300 hover:bg-red-50 dark:border-white/10 dark:hover:bg-red-500/10 transition-colors">
                            <span>Eliminar proveedor</span><i class="bi bi-trash" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- ============ REPUESTOS QUE SURTE ============ -->
            <div class="lg:col-span-2 rounded-xl border border-slate-200 bg-white dark:border-white/5 dark:bg-navy-surface">
                <div class="flex items-center justify-between border-b border-slate-100 px-6 py-5 dark:border-white/5">
                    <div>
                        <h2 class="font-display font-bold text-navy dark:text-white">Repuestos</h2>
                        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Repuestos que tienen a este proveedor como origen.</p>
                    </div>
                </div>

                <div th:if="${repuestos != null and !repuestos.empty}" class="divide-y divide-slate-100 dark:divide-white/5">
                    <a th:each="r : ${repuestos}" th:href="@{/repuesto/{id}(id=${r.id})}" href="#"
                       class="flex items-center justify-between gap-4 px-6 py-4 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
                        <div class="min-w-0">
                            <p class="font-medium text-navy dark:text-white" th:text="${r.nombre}">Radiador</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400" th:text="${r.categoria}">Enfriamiento</p>
                        </div>
                        <span class="shrink-0 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-500 dark:bg-white/10 dark:text-slate-300" th:text="'Stock: ' + ${r.stock}">Stock: 5</span>
                    </a>
                </div>
                <div th:if="${repuestos == null or repuestos.empty}" class="px-6 py-12 text-center">
                    <p class="font-medium text-navy dark:text-white">Todavía no hay repuestos asociados a este proveedor.</p>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    const root = document.documentElement;
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuButton = document.getElementById('menu-button');
    function toggleMenu() { sidebar.classList.toggle('-translate-x-full'); overlay.classList.toggle('hidden'); }
    menuButton?.addEventListener('click', toggleMenu);
    overlay?.addEventListener('click', toggleMenu);

    const iconMoon = document.getElementById('icon-moon');
    const iconSun = document.getElementById('icon-sun');
    function applyTheme(isDark) {
        root.classList.toggle('dark', isDark);
        iconMoon.classList.toggle('hidden', isDark);
        iconSun.classList.toggle('hidden', !isDark);
    }
    const savedTheme = localStorage.getItem('autogest-theme');
    applyTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = !root.classList.contains('dark');
        applyTheme(isDark);
        localStorage.setItem('autogest-theme', isDark ? 'dark' : 'light');
    });
</script>
</body>
</html>
